<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lounge Welcome Board</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f1012;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* 상단 모드 전환 탭 (화면이 나오는지 바로 확인 가능) */
    .nav-bar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 999;
    }
    .nav-btn {
      background: #25272c;
      color: #e0e0e0;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #3c3f47;
    }

    /* 1. TV 디스플레이 영역 */
    #tv-section {
      display: none;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 40px;
      text-align: center;
    }
    .clock {
      font-size: 2.2rem;
      color: #7b8089;
      font-weight: 300;
      letter-spacing: 2px;
    }
    .center-content {
      margin: auto 0;
      transition: opacity 0.5s ease;
    }
    .brand {
      font-size: 1.6rem;
      color: #c5a880;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }
    .guest {
      font-size: 4.8rem;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }
    .message {
      font-size: 1.7rem;
      color: #9da3ad;
      font-weight: 300;
    }
    .footer {
      font-size: 1rem;
      color: #4a4d54;
      letter-spacing: 3px;
    }

    /* 2. 관리자 영역 */
    #admin-section {
      display: none;
      width: 90%;
      max-width: 440px;
      background: #18191c;
      border: 1px solid #2a2c33;
      border-radius: 16px;
      padding: 30px;
    }
    .admin-header {
      font-size: 1.3rem;
      color: #c5a880;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .input-label {
      display: block;
      margin-bottom: 8px;
      color: #8f95a0;
      font-size: 0.9rem;
    }
    input, textarea {
      width: 100%;
      padding: 14px;
      background: #23252a;
      border: 1px solid #363942;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 18px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #c5a880;
      border: none;
      border-radius: 8px;
      color: #111;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: center;
      color: #4ade80;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 모드 전환 버튼 -->
  <div class="nav-bar">
    <a href="?view=tv" class="nav-btn">📺 TV 화면</a>
    <a href="?view=admin" class="nav-btn">📱 관리자 화면</a>
  </div>

  <!-- TV 화면 -->
  <div id="tv-section">
    <div class="clock" id="clock">00:00</div>
    <div class="center-content" id="center-content">
      <div class="brand">Private Lounge</div>
      <div class="guest" id="guest-name">Welcome</div>
      <div class="message" id="guest-msg">프라이빗 라운지에 오신 것을 환영합니다.</div>
    </div>
    <div class="footer">EXCLUSIVE LOUNGE</div>
  </div>

  <!-- 관리자 화면 -->
  <div id="admin-section">
    <div class="admin-header">TV 화면 문구 변경</div>
    <label class="input-label">예약자 / 방문자 이름</label>
    <input type="text" id="name-input" placeholder="예: 김대표 님, 에이비씨 파트너스">
    <label class="input-label">안내 문구</label>
    <textarea id="msg-input" rows="3" placeholder="예: 편안하고 성공적인 시간 되시기를 바랍니다."></textarea>
    <button onclick="saveData()">TV 화면에 즉시 반영</button>
    <div id="status">✓ TV 화면으로 전송 완료!</div>
  </div>

  <script>
    // ==============================================================
    // ⚠️ 아래 두 줄의 따옴표 안에 아까 확인하신 URL과 Key를 넣어주세요.
    // SUPABASE_URL 끝에 /rest/v1 이 없어야 합니다.
    // ==============================================================
    const SUPABASE_URL = 'https://jorxmazliodqnxnwctlc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GAU-azI_hJvms8k3Nzsyiw_PRH0NG69';

    const isTV = window.location.search.includes('view=tv');

    if (isTV) {
      document.getElementById('tv-section').style.display = 'flex';

      // 시계 작동
      function updateClock() {
        const d = new Date();
        document.getElementById('clock').innerText = 
          d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
      }
      setInterval(updateClock, 1000);
      updateClock();

      // 화면 업데이트 함수
      function updateScreen(name, msg) {
        const box = document.getElementById('center-content');
        box.style.opacity = '0';
        setTimeout(() => {
          if (name) document.getElementById('guest-name').innerText = name;
          if (msg) document.getElementById('guest-msg').innerText = msg;
          box.style.opacity = '1';
        }, 300);
      }

      // Supabase 데이터 가져오기 (3초마다 자동 확인 - 가장 안정적인 폴링 방식)
      async function fetchLatestData() {
        if (!SUPABASE_URL.startsWith('http') || SUPABASE_URL.includes('여기에')) return;
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/welcome_screen?id=eq.1&select=*`, {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          });
          const data = await res.json();
          if (data && data[0]) {
            updateScreen(data[0].guest_name, data[0].sub_message);
          }
        } catch(e) {
          console.error(e);
        }
      }
      fetchLatestData();
      setInterval(fetchLatestData, 3000); // 3초마다 변경 감지

    } else {
      // 기본은 관리자 화면 표시
      document.getElementById('admin-section').style.display = 'block';

      async function saveData() {
        const name = document.getElementById('name-input').value.trim();
        const msg = document.getElementById('msg-input').value.trim();
        if (!name) return alert('이름을 입력해주세요.');

        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/welcome_screen?id=eq.1`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              guest_name: name,
              sub_message: msg || '편안하고 생산적인 시간 되시기를 바랍니다.',
              updated_at: new Date()
            })
          });

          if (res.ok) {
            const st = document.getElementById('status');
            st.style.display = 'block';
            setTimeout(() => { st.style.display = 'none'; }, 3000);
          } else {
            alert('저장 실패: ' + res.statusText);
          }
        } catch(e) {
          alert('연결 에러: ' + e.message);
        }
      }
    }
  </script>
</body>
</html>
