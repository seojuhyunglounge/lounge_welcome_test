<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Lounge Welcome Screen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c0e;
      color: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto; /* 스마트폰 관리자 화면에서 부드러운 스크롤 허용 */
      -webkit-overflow-scrolling: touch;
    }

    /* 1. TV 디스플레이 화면 (TV 모드에서만 화면 고정 및 스크롤바 숨김) */
    #tv-section {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 70px 50px;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
    }

    /* 배경 동영상 레이어 (완전한 무음 전용) */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      display: none;
      pointer-events: none;
    }

    /* 럭셔리 다크 비네팅 오버레이 */
    #video-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(12, 13, 16, 0.45) 0%, rgba(8, 9, 11, 0.9) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .tv-layer { position: relative; z-index: 2; }
    .clock-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .clock-time { font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: #e5e7eb; letter-spacing: 4px; }
    .clock-date { font-size: 0.95rem; color: #8b919d; letter-spacing: 3px; text-transform: uppercase; }

    .center-box { margin: auto 0; transition: opacity 0.5s ease; max-width: 1000px; }
    .brand-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: #c9a96e;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: inline-block;
      border-bottom: 1px solid rgba(201, 169, 110, 0.35);
      padding-bottom: 8px;
    }

    /* 럭셔리 예약자명 타이포그래피 */
    .guest-title-wrap {
      font-size: 5rem;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 24px;
      letter-spacing: -1px;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.95);
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Mr. Dr. 영문 접두사 (세리프) */
    .honorific-prefix {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78em;
      font-weight: 400;
      color: #dfcfb2;
      letter-spacing: 2px;
      margin-right: 2px;
    }

    /* 메인 이름 */
    .guest-core-name {
      color: #ffffff;
    }

    /* 뒤에 붙는 '님' (이름 본체 대비 55% 크기로 섬세하게 배치) */
    .honorific-suffix {
      font-size: 0.55em;
      font-weight: 300;
      color: #d1d5db;
      margin-left: 2px;
      letter-spacing: 0px;
    }

    .sub-desc { font-size: 1.7rem; color: #b8bdc9; font-weight: 300; line-height: 1.6; }
    .footer-bar { font-size: 0.95rem; color: #555a64; letter-spacing: 4px; text-transform: uppercase; }

    #tv-status-badge {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 9999;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 4px;
      background: rgba(0,0,0,0.75);
      color: #888;
      border: 1px solid #333;
    }

    /* 2. 관리자 화면 (모바일 하단 여유 마진 90px 추가) */
    #admin-section {
      display: none;
      width: 92%;
      max-width: 500px;
      margin: 30px auto 90px auto;
      background: #16171b;
      border: 1px solid #282a32;
      border-radius: 18px;
      padding: 28px;
    }
    .admin-title { font-size: 1.3rem; color: #c9a96e; font-weight: 600; margin-bottom: 22px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; color: #9297a3; font-size: 0.9rem; }
    input, textarea, select {
      width: 100%;
      padding: 14px;
      background: #212329;
      border: 1px solid #333640;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #c9a96e; }

    /* 토글 스위치 영역 */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1f2128;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid #2a2c35;
    }
    .toggle-label {
      font-size: 0.92rem;
      color: #e5e7eb;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .toggle-sub {
      font-size: 0.75rem;
      color: #8b919d;
      margin-top: 2px;
    }

    /* 스위치 UI */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #374151;
      transition: .3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #c9a96e; }
    input:checked + .slider:before { transform: translateX(20px); }

    .prefix-select-wrap {
      display: none;
      margin-bottom: 14px;
      padding: 10px;
      background: #1a1b22;
      border-radius: 10px;
      border: 1px dashed #3a3d4a;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #c9a96e;
      border: none;
      border-radius: 10px;
      color: #0d0e11;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active { opacity: 0.8; }
    #log-box {
      margin-top: 15px;
      padding: 12px;
      background: #0f1013;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 0.85rem;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
  </style>
</head>
<body>

  <!-- TV 디스플레이 화면 -->
  <div id="tv-section">
    <video id="bg-video" autoplay loop muted playsinline preload="auto"></video>
    <div id="video-overlay"></div>

    <div class="tv-layer clock-box">
      <div class="clock-time" id="clock-time">00:00</div>
      <div class="clock-date" id="clock-date">--</div>
    </div>
    
    <div class="tv-layer center-box" id="center-box">
      <div class="brand-tag">PRIVATE BUSINESS LOUNGE</div>
      <div class="guest-title-wrap">
        <span class="honorific-prefix" id="guest-prefix"></span>
        <span class="guest-core-name" id="guest-name">Welcome</span>
        <span class="honorific-suffix" id="guest-suffix"></span>
      </div>
      <div class="sub-desc" id="guest-msg">프라이빗 라운지에 오신 것을 환영합니다.</div>
    </div>

    <div class="tv-layer footer-bar">EXCLUSIVELY RESERVED FOR YOUR SUCCESS</div>
    <div id="tv-status-badge">동기화 대기중...</div>
    <audio id="bgm-player" loop preload="auto"></audio>
  </div>

  <!-- 관리자 화면 -->
  <div id="admin-section">
    <div style="text-align: right; margin-bottom: 15px;">
      <a href="?view=tv" target="_blank" style="color: #c9a96e; font-size: 0.85rem; text-decoration: none;">📺 TV 화면 새 창 열기 ↗</a>
    </div>

    <div class="admin-title">TV 웰컴 보드 설정</div>
    
    <!-- 1. 앞자리 영문 경칭 토글 & 선택창 -->
    <div class="toggle-row">
      <div class="toggle-label">
        <span>앞자리 경칭 사용 (Mr., Dr. 등)</span>
        <span class="toggle-sub">외국인 VIP 손님 방문 시 권장</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="prefix-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="prefix-select-wrap" id="prefix-select-box">
      <label style="margin-bottom: 6px;">영문 경칭 선택</label>
      <select id="prefix-select">
        <option value="Mr.">Mr. (남성)</option>
        <option value="Ms.">Ms. (여성)</option>
        <option value="Mrs.">Mrs. (기혼 여성)</option>
        <option value="Dr.">Dr. (박사 / 의사 / 석학)</option>
        <option value="Prof.">Prof. (교수)</option>
        <option value="Sir">Sir (존칭)</option>
      </select>
    </div>

    <!-- 2. 예약자 / 회사 본체 이름 입력창 -->
    <div class="form-group">
      <label>예약자 본명 / 회사명</label>
      <input type="text" id="name-input" placeholder="예: John Smith, 김대표, 삼정회계법인">
    </div>

    <!-- 3. 뒷자리 '님' 호칭 토글 -->
    <div class="toggle-row">
      <div class="toggle-label">
        <span>이름 뒤 '님' 표기</span>
        <span class="toggle-sub">이름보다 작은 크기로 섬세하게 배치</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="suffix-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="form-group">
      <label>서브 환영 문구</label>
      <textarea id="msg-input" rows="3" placeholder="예: 편안하고 성공적인 시간 되시기를 바랍니다."></textarea>
    </div>

    <div class="form-group">
      <label>배경 테마 선택</label>
      <select id="bg-select">
        <optgroup label="── 🎬 시네마틱 모션 비디오 ──">
          <option value="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">🎬 1. 테스트 비디오 (검증용)</option>
          <option value="video1.mp4">🎬 2. 자체 업로드 라운지 영상 (video1.mp4)</option>
          <option value="video2.mp4">🎬 2. 자체 업로드 라운지 영상 (video2.mp4)</option>
          <option value="video3.mp4">🎬 2. 자체 업로드 라운지 영상 (video3.mp4)</option>
        </optgroup>
        <optgroup label="── 🖼 하이엔드 인테리어 스틸 ──">
          <option value="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2560&q=85">3. 하이엔드 스톤 라운지</option>
          <option value="https://images.unsplash.com/photo-1572116469696-31de0f17cc34?auto=format&fit=crop&w=2560&q=85">4. 클래식 딥 월넛 살롱</option>
          <option value="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=2560&q=85">5. 이그제큐티브 펜트하우스</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label>배경음악 (BGM) 선택</label>
      <select id="bgm-select">
        <option value="jazz1.mp3">1. Autumn Leaves 클래식 재즈 (자체 음원)</option>
        <option value="jazz2.mp3">2. 라운지 스윙 재즈 2 (자체 음원)</option>
        <option value="none">3. 음악 끄기 (BGM Off)</option>
      </select>
    </div>

    <button type="button" id="save-btn">TV 화면에 즉시 반영</button>
    <div id="log-box"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jorxmazliodqnxnwctlc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GAU-azI_hJvms8k3Nzsyiw_PRH0NG69';

    const cleanUrl = SUPABASE_URL.trim();
    const cleanKey = SUPABASE_KEY.trim();

    const isTV = window.location.search.indexOf('view=tv') !== -1;

    function log(msg, color) {
      const box = document.getElementById('log-box');
      if (box) {
        box.style.display = 'block';
        box.style.color = color || '#fff';
        box.innerText = msg;
      }
    }

    if (isTV) {
      // 1. TV 디스플레이 모드
      const tvSection = document.getElementById('tv-section');
      const bgVideo = document.getElementById('bg-video');
      const videoOverlay = document.getElementById('video-overlay');
      const badge = document.getElementById('tv-status-badge');
      const player = document.getElementById('bgm-player');
      
      bgVideo.muted = true;
      bgVideo.defaultMuted = true;
      bgVideo.volume = 0;
      player.volume = 0.35;

      tvSection.style.display = 'flex';

      function updateClock() {
        const d = new Date();
        document.getElementById('clock-time').innerText = 
          d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        document.getElementById('clock-date').innerText = 
          d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }
      setInterval(updateClock, 1000);
      updateClock();

      let currentDataKey = '';
      let currentBgmUrl = '';

      function unlockMedia() {
        if (bgVideo.style.display === 'block' && bgVideo.paused) {
          bgVideo.play().catch(console.error);
        }
        if (player.src && player.paused && currentBgmUrl !== 'none') {
          player.play().then(() => {
            badge.innerText = '● 비디오 + BGM 동시 재생 중 🎵';
            badge.style.color = '#4ade80';
          }).catch(console.error);
        }
      }
      window.addEventListener('click', unlockMedia);
      window.addEventListener('touchstart', unlockMedia);

      function updateBoard(prefix, name, suffix, msg, bgUrl, bgmUrl) {
        const newKey = prefix + '|' + name + '|' + suffix + '|' + msg + '|' + bgUrl + '|' + bgmUrl;
        if (newKey === currentDataKey) return;
        currentDataKey = newKey;

        const box = document.getElementById('center-box');
        box.style.opacity = '0';
        setTimeout(function() {
          const pEl = document.getElementById('guest-prefix');
          if (prefix) {
            pEl.innerText = prefix;
            pEl.style.display = 'inline';
          } else {
            pEl.innerText = '';
            pEl.style.display = 'none';
          }

          document.getElementById('guest-name').innerText = name || 'Welcome';

          const sEl = document.getElementById('guest-suffix');
          if (suffix) {
            sEl.innerText = suffix;
            sEl.style.display = 'inline';
          } else {
            sEl.innerText = '';
            sEl.style.display = 'none';
          }

          if (msg) document.getElementById('guest-msg').innerText = msg;
          box.style.opacity = '1';
        }, 400);

        const isVideo = bgUrl.toLowerCase().indexOf('.mp4') !== -1;
        if (isVideo) {
          tvSection.style.backgroundImage = 'none';
          bgVideo.style.display = 'block';
          videoOverlay.style.display = 'block';

          if (bgVideo.getAttribute('data-src') !== bgUrl) {
            bgVideo.setAttribute('data-src', bgUrl);
            bgVideo.src = bgUrl;
            bgVideo.muted = true;
            bgVideo.volume = 0;
            bgVideo.load();
            bgVideo.play().catch(e => console.log('Video play wait:', e));
          }
        } else {
          bgVideo.pause();
          bgVideo.removeAttribute('src');
          bgVideo.style.display = 'none';
          videoOverlay.style.display = 'block';
          tvSection.style.backgroundImage = "url('" + bgUrl + "')";
        }

        if (bgmUrl !== currentBgmUrl) {
          currentBgmUrl = bgmUrl;
          if (!bgmUrl || bgmUrl === 'none') {
            player.pause();
            badge.innerText = '● 정상 연결됨 (음악 OFF)';
            badge.style.color = '#4ade80';
          } else {
            player.src = bgmUrl;
            player.load();
            player.play().then(() => {
              badge.innerText = '● 비디오 + BGM 동시 재생 중 🎵';
              badge.style.color = '#4ade80';
            }).catch(() => {
              badge.innerText = '⚠️ 화면을 한 번 클릭해 주세요 (미디어 켜기)';
              badge.style.color = '#ffd166';
            });
          }
        }
      }

      async function syncTV() {
        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen?select=*&id=eq.1', {
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey
            }
          });
          if (!res.ok) return;

          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];
            let rawName = item.guest_name || '';
            let rawMsg = item.sub_message || '';
            
            let prefix = '';
            let name = rawName;
            let suffix = '';

            if (rawName.indexOf(':::') !== -1) {
              const nameParts = rawName.split(':::');
              prefix = nameParts[0] || '';
              name = nameParts[1] || '';
              suffix = nameParts[2] || '';
            }

            let msgText = rawMsg;
            let bg = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
            let bgm = 'jazz1.mp3';

            if (rawMsg.indexOf('|||') !== -1) {
              const parts = rawMsg.split('|||');
              msgText = parts[0];
              bg = parts[1] || bg;
              bgm = parts[2] || bgm;
            }
            updateBoard(prefix, name, suffix, msgText, bg, bgm);
          }
        } catch(e) {}
      }

      syncTV();
      setInterval(syncTV, 1500);

    } else {
      // 2. 모바일 관리자 모드
      document.getElementById('admin-section').style.display = 'block';

      const prefixToggle = document.getElementById('prefix-toggle');
      const prefixSelectBox = document.getElementById('prefix-select-box');
      const prefixSelect = document.getElementById('prefix-select');
      const suffixToggle = document.getElementById('suffix-toggle');

      prefixToggle.addEventListener('change', function() {
        prefixSelectBox.style.display = this.checked ? 'block' : 'none';
      });

      async function loadInitial() {
        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen?select=*&id=eq.1', {
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey
            }
          });
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];
            const rawName = item.guest_name || '';
            
            if (rawName.indexOf(':::') !== -1) {
              const nParts = rawName.split(':::');
              const pref = nParts[0];
              document.getElementById('name-input').value = nParts[1] || '';
              const suff = nParts[2];

              if (pref) {
                prefixToggle.checked = true;
                prefixSelectBox.style.display = 'block';
                prefixSelect.value = pref;
              } else {
                prefixToggle.checked = false;
                prefixSelectBox.style.display = 'none';
              }

              suffixToggle.checked = (suff === '님');
            } else {
              document.getElementById('name-input').value = rawName;
              prefixToggle.checked = false;
              suffixToggle.checked = true;
            }

            let msg = item.sub_message || '';
            if (msg.indexOf('|||') !== -1) {
              const parts = msg.split('|||');
              document.getElementById('msg-input').value = parts[0];
              document.getElementById('bg-select').value = parts[1];
              if (parts[2]) document.getElementById('bgm-select').value = parts[2];
            } else {
              document.getElementById('msg-input').value = msg;
            }
          }
        } catch(e) {}
      }
      loadInitial();

      document.getElementById('save-btn').addEventListener('click', async function() {
        const nameInput = document.getElementById('name-input').value.trim();
        const msg = document.getElementById('msg-input').value.trim();
        const bg = document.getElementById('bg-select').value;
        const bgm = document.getElementById('bgm-select').value;

        if (!nameInput) return alert('예약자 본명 또는 회사명을 입력해 주세요.');

        const prefixVal = prefixToggle.checked ? prefixSelect.value : '';
        const suffixVal = suffixToggle.checked ? '님' : '';
        const combinedName = prefixVal + ':::' + nameInput + ':::' + suffixVal;

        log('전송 중...', '#ffd166');
        const combinedMsg = (msg || '편안하고 성공적인 시간 되시기를 바랍니다.') + '|||' + bg + '|||' + bgm;

        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen', {
            method: 'POST',
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates,return=representation'
            },
            body: JSON.stringify({
              id: 1,
              guest_name: combinedName,
              sub_message: combinedMsg,
              updated_at: new Date().toISOString()
            })
          });

          if (res.ok) {
            log('✓ TV 반영 성공! (' + new Date().toLocaleTimeString() + ' 전송됨)', '#4ade80');
          } else {
            const errText = await res.text();
            log('✗ 저장 실패: ' + errText, '#ff6b6b');
          }
        } catch(e) {
          log('✗ 오류: ' + e.message, '#ff6b6b');
        }
      });
    }
  </script>
