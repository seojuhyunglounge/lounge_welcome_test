<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Colonne - Welcome Screen & Lounge Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c0e;
      color: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 1. TV 디스플레이 화면 */
    #tv-section {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 75px 50px 35px 50px;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 배경 동영상 레이어 */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      display: none;
      pointer-events: none;
    }

    /* 럭셔리 다크 비네팅 오버레이 */
    #video-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(12, 13, 16, 0.42) 0%, rgba(8, 9, 11, 0.92) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .tv-layer { position: relative; z-index: 2; width: 100%; }
    
    /* 상단 레이어: 시계 + La Colonne */
    .top-header-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .clock-box { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .clock-time { font-family: 'Cormorant Garamond', serif; font-size: 2.3rem; color: #d6d9e0; letter-spacing: 4px; font-weight: 400; line-height: 1; }
    .clock-date { font-size: 0.85rem; color: #858b97; letter-spacing: 3px; text-transform: uppercase; font-weight: 300; }

    .brand-container {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-top: 18px;
    }
    .space-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.3rem;
      font-weight: 500;
      color: #dfcfb2;
      letter-spacing: 14px;
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: 8px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9);
    }
    .space-category {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.02rem;
      font-weight: 400;
      color: #a89472;
      letter-spacing: 8px;
      text-transform: uppercase;
      padding-top: 7px;
      border-top: 1px solid rgba(201, 169, 110, 0.35);
      white-space: nowrap;
      display: inline-block;
      padding-left: 15px;
      padding-right: 15px;
    }

    /* 화면 중앙 VIP 웰컴 블록 */
    .center-box {
      margin: auto 0;
      transition: opacity 0.5s ease;
      max-width: 1100px;
      transform: translateY(-25px);
    }

    .guest-title-wrap {
      font-size: 5.2rem;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 20px;
      letter-spacing: -1px;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.95);
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    .honorific-prefix {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78em;
      font-weight: 400;
      color: #dfcfb2;
      letter-spacing: 2px;
      margin-right: 2px;
    }

    .guest-core-name { color: #ffffff; }

    .honorific-suffix {
      font-size: 0.55em;
      font-weight: 300;
      color: #d1d5db;
      margin-left: 2px;
      letter-spacing: 0px;
    }

    .sub-desc { 
      font-size: 1.65rem; 
      color: #b8bdc9; 
      font-weight: 300; 
      line-height: 1.6; 
      text-shadow: 0 2px 12px rgba(0,0,0,0.85);
    }

    /* 하단 OTT 럭셔리 런처 독 (DOCK) 바 */
    .bottom-interactive-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .ott-dock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(18, 20, 26, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(201, 169, 110, 0.28);
      border-radius: 50px;
      padding: 10px 24px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }
    .ott-dock:hover {
      border-color: rgba(201, 169, 110, 0.6);
      background: rgba(18, 20, 26, 0.85);
    }

    .ott-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      color: #dfcfb2;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      transition: all 0.25s ease;
      cursor: pointer;
      outline: none;
    }
    .ott-btn:hover, .ott-btn:focus {
      background: #c9a96e;
      color: #0b0c0e;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 20px rgba(201, 169, 110, 0.4);
      font-weight: 700;
    }
    .ott-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .footer-bar { 
      font-size: 0.85rem; 
      color: #616674; 
      letter-spacing: 5px; 
      text-transform: uppercase; 
      font-weight: 300;
    }

    #tv-status-badge {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 9999;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 4px;
      background: rgba(0,0,0,0.75);
      color: #888;
      border: 1px solid #333;
    }

    /* 2. 관리자 화면 */
    #admin-section {
      display: none;
      width: 92%;
      max-width: 500px;
      margin: 30px auto 90px auto;
      background: #16171b;
      border: 1px solid #282a32;
      border-radius: 18px;
      padding: 28px;
    }
    .admin-title { font-size: 1.3rem; color: #c9a96e; font-weight: 600; margin-bottom: 22px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; color: #9297a3; font-size: 0.9rem; }
    input, textarea, select {
      width: 100%;
      padding: 14px;
      background: #212329;
      border: 1px solid #333640;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #c9a96e; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1f2128;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid #2a2c35;
    }
    .toggle-label {
      font-size: 0.92rem;
      color: #e5e7eb;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .toggle-sub { font-size: 0.75rem; color: #8b919d; margin-top: 2px; }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #374151;
      transition: .3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #c9a96e; }
    input:checked + .slider:before { transform: translateX(20px); }

    .prefix-select-wrap {
      display: none;
      margin-bottom: 14px;
      padding: 10px;
      background: #1a1b22;
      border-radius: 10px;
      border: 1px dashed #3a3d4a;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #c9a96e;
      border: none;
      border-radius: 10px;
      color: #0d0e11;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active { opacity: 0.8; }
    #log-box {
      margin-top: 15px;
      padding: 12px;
      background: #0f1013;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 0.85rem;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 2. 관리자 화면 -->
  <div id="admin-section">

      <a href="?view=tv" target="_blank" style="color: #c9a96e; font-size: 0.85rem; text-decoration: none;">📺 TV 화면 새 창 열기 ↗</a>

  <script>
    const SUPABASE_URL = 'https://jorxmazliodqnxnwctlc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GAU-azI_hJvms8k3Nzsyiw_PRH0NG69';

    const cleanUrl = SUPABASE_URL.trim();
    const cleanKey = SUPABASE_KEY.trim();

    const isTV = window.location.search.indexOf('view=tv') !== -1;

    function pauseBgmForApp() {
      const p = document.getElementById('bgm-player');
      if (p) p.pause();
    }

    function log(msg, color) {
      const box = document.getElementById('log-box');
      if (box) {
        box.style.display = 'block';
        box.style.color = color || '#fff';
        box.innerText = msg;
      }
    }

    if (isTV) {
      // 1. TV 디스플레이 모드
      const tvSection = document.getElementById('tv-section');
      const bgVideo = document.getElementById('bg-video');
      const videoOverlay = document.getElementById('video-overlay');
      const badge = document.getElementById('tv-status-badge');
      const player = document.getElementById('bgm-player');
      
      bgVideo.muted = true;
      bgVideo.defaultMuted = true;
      bgVideo.volume = 0;
      player.volume = 0.35;

      tvSection.style.display = 'flex';

      function updateClock() {
        const d = new Date();
        document.getElementById('clock-time').innerText = 
          d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        document.getElementById('clock-date').innerText = 
          d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }
      setInterval(updateClock, 1000);
      updateClock();

      let currentDataKey = '';
      let currentBgmUrl = '';

      function unlockMedia() {
        if (bgVideo.style.display === 'block' && bgVideo.paused) {
          bgVideo.play().catch(console.error);
        }
        if (player.src && player.paused && currentBgmUrl !== 'none') {
          player.play().then(() => {
            badge.innerText = '● 비디오 + BGM 동시 재생 중 🎵';
            badge.style.color = '#4ade80';
          }).catch(console.error);
        }
      }
      window.addEventListener('click', unlockMedia);
      window.addEventListener('touchstart', unlockMedia);

      function updateBoard(prefix, name, suffix, msg, bgUrl, bgmUrl) {
        const newKey = (prefix || '') + '|' + (name || '') + '|' + (suffix || '') + '|' + (msg || '') + '|' + bgUrl + '|' + bgmUrl;
        if (newKey === currentDataKey) return;
        currentDataKey = newKey;

        const box = document.getElementById('center-box');
        box.style.opacity = '0';
        setTimeout(function() {
          const pEl = document.getElementById('guest-prefix');
          if (prefix) {
            pEl.innerText = prefix;
            pEl.style.display = 'inline';
          } else {
            pEl.innerText = '';
            pEl.style.display = 'none';
          }

          document.getElementById('guest-name').innerText = name || 'Welcome';

          const sEl = document.getElementById('guest-suffix');
          if (suffix) {
            sEl.innerText = suffix;
            sEl.style.display = 'inline';
          } else {
            sEl.innerText = '';
            sEl.style.display = 'none';
          }

          if (msg) document.getElementById('guest-msg').innerText = msg;
          box.style.opacity = '1';
        }, 400);

        const isVideo = bgUrl.toLowerCase().indexOf('.mp4') !== -1;
        if (isVideo) {
          tvSection.style.backgroundImage = 'none';
          bgVideo.style.display = 'block';
          videoOverlay.style.display = 'block';

          if (bgVideo.getAttribute('data-src') !== bgUrl) {
            bgVideo.setAttribute('data-src', bgUrl);
            bgVideo.src = bgUrl;
            bgVideo.muted = true;
            bgVideo.volume = 0;
            bgVideo.load();
            bgVideo.play().catch(e => console.log('Video play wait:', e));
          }
        } else {
          bgVideo.pause();
          bgVideo.removeAttribute('src');
          bgVideo.style.display = 'none';
          videoOverlay.style.display = 'block';
          tvSection.style.backgroundImage = "url('" + bgUrl + "')";
        }

        if (bgmUrl !== currentBgmUrl) {
          currentBgmUrl = bgmUrl;
          if (!bgmUrl || bgmUrl === 'none') {
            player.pause();
            badge.innerText = '● 정상 연결됨 (음악 OFF)';
            badge.style.color = '#4ade80';
          } else {
            player.src = bgmUrl;
            player.load();
            player.play().then(() => {
              badge.innerText = '● 비디오 + BGM 동시 재생 중 🎵';
              badge.style.color = '#4ade80';
            }).catch(() => {
              badge.innerText = '⚠️ 화면을 한 번 클릭해 주세요 (미디어 켜기)';
              badge.style.color = '#ffd166';
            });
          }
        }
      }

      // 개별 정규화 컬럼 직접 동기화 (split 파싱 제거)
      async function syncTV() {
        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen?select=*&id=eq.1', {
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey
            }
          });
          if (!res.ok) return;

          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];
            updateBoard(
              item.prefix || '',
              item.guest_name || 'Welcome',
              item.suffix || '',
              item.sub_message || '',
              item.bg_source || 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
              item.bgm_source || 'jazz1.mp3'
            );
          }
        } catch(e) {}
      }

      syncTV();
      setInterval(syncTV, 2000); // 2초 주기로 더욱 안정적으로 동기화

    } else {
      // 2. 모바일 관리자 모드
      document.getElementById('admin-section').style.display = 'block';

      const prefixToggle = document.getElementById('prefix-toggle');
      const prefixSelectBox = document.getElementById('prefix-select-box');
      const prefixSelect = document.getElementById('prefix-select');
      const suffixToggle = document.getElementById('suffix-toggle');

      prefixToggle.addEventListener('change', function() {
        prefixSelectBox.style.display = this.checked ? 'block' : 'none';
      });

      // DB에서 현재 설정값 그대로 로드
      async function loadInitial() {
        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen?select=*&id=eq.1', {
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey
            }
          });
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];

            if (item.prefix) {
              prefixToggle.checked = true;
              prefixSelectBox.style.display = 'block';
              prefixSelect.value = item.prefix;
            } else {
              prefixToggle.checked = false;
              prefixSelectBox.style.display = 'none';
            }

            document.getElementById('name-input').value = item.guest_name || '';
            suffixToggle.checked = (item.suffix === '님');
            document.getElementById('msg-input').value = item.sub_message || '';
            if (item.bg_source) document.getElementById('bg-select').value = item.bg_source;
            if (item.bgm_source) document.getElementById('bgm-select').value = item.bgm_source;
          }
        } catch(e) {}
      }
      loadInitial();

      // 개별 컬럼으로 깨끗하게 저장 (JSON 오브젝트 전송)
      document.getElementById('save-btn').addEventListener('click', async function() {
        const nameInput = document.getElementById('name-input').value.trim();
        const msg = document.getElementById('msg-input').value.trim();
        const bg = document.getElementById('bg-select').value;
        const bgm = document.getElementById('bgm-select').value;

        if (!nameInput) return alert('예약자 본명 또는 회사명을 입력해 주세요.');

        const prefixVal = prefixToggle.checked ? prefixSelect.value : '';
        const suffixVal = suffixToggle.checked ? '님' : '';

        log('전송 중...', '#ffd166');

        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen', {
            method: 'POST',
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates,return=representation'
            },
            body: JSON.stringify({
              id: 1,
              prefix: prefixVal,
              guest_name: nameInput,
              suffix: suffixVal,
              sub_message: msg || '편안하고 성공적인 시간 되시기를 바랍니다.',
              bg_source: bg,
              bgm_source: bgm,
              updated_at: new Date().toISOString()
            })
          });

          if (res.ok) {
            log('✓ TV 반영 성공! (' + new Date().toLocaleTimeString() + ' 전송됨)', '#4ade80');
          } else {
            const errText = await res.text();
            log('✗ 저장 실패: ' + errText, '#ff6b6b');
          }
        } catch(e) {
          log('✗ 오류: ' + e.message, '#ff6b6b');
        }
      });
    }
  </script>
</body>
</html>
