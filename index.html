<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Lounge Welcome Screen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c0e;
      color: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 1. TV 디스플레이 화면 */
    #tv-section {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 70px 50px;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1s ease-in-out;
      cursor: pointer;
    }
    #tv-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(12, 13, 16, 0.6) 0%, rgba(8, 9, 11, 0.92) 100%);
      z-index: 1;
    }
    .tv-layer { position: relative; z-index: 2; }
    .clock-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .clock-time { font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: #e5e7eb; letter-spacing: 4px; }
    .clock-date { font-size: 0.95rem; color: #8b919d; letter-spacing: 3px; text-transform: uppercase; }

    .center-box { margin: auto 0; transition: opacity 0.5s ease; max-width: 950px; }
    .brand-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: #c9a96e;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: inline-block;
      border-bottom: 1px solid rgba(201, 169, 110, 0.35);
      padding-bottom: 8px;
    }
    .guest-title {
      font-size: 5rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 24px;
      letter-spacing: -1px;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.85);
    }
    .sub-desc { font-size: 1.7rem; color: #b8bdc9; font-weight: 300; line-height: 1.6; }
    .footer-bar { font-size: 0.95rem; color: #555a64; letter-spacing: 4px; text-transform: uppercase; }

    /* TV 화면 좌측 하단 상태 배지 */
    #tv-status-badge {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 9999;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.6);
      color: #888;
      border: 1px solid #333;
    }

    /* 2. 관리자 화면 */
    #admin-section {
      display: none;
      width: 92%;
      max-width: 480px;
      margin: 30px auto;
      background: #16171b;
      border: 1px solid #282a32;
      border-radius: 18px;
      padding: 28px;
    }
    .admin-title { font-size: 1.3rem; color: #c9a96e; font-weight: 600; margin-bottom: 22px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; color: #9297a3; font-size: 0.9rem; }
    input, textarea, select {
      width: 100%;
      padding: 14px;
      background: #212329;
      border: 1px solid #333640;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #c9a96e; }
    button {
      width: 100%;
      padding: 16px;
      background: #c9a96e;
      border: none;
      border-radius: 10px;
      color: #0d0e11;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    button:active { opacity: 0.8; }
    #log-box {
      margin-top: 15px;
      padding: 12px;
      background: #0f1013;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 0.85rem;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
  </style>
</head>
<body>

  <!-- TV 디스플레이 화면 -->
  <div id="tv-section">
    <div class="tv-layer clock-box">
      <div class="clock-time" id="clock-time">00:00</div>
      <div class="clock-date" id="clock-date">--</div>
    </div>
    <div class="tv-layer center-box" id="center-box">
      <div class="brand-tag">PRIVATE BUSINESS LOUNGE</div>
      <div class="guest-title" id="guest-name">Welcome</div>
      <div class="sub-desc" id="guest-msg">프라이빗 라운지에 오신 것을 환영합니다.</div>
    </div>
    <div class="tv-layer footer-bar">EXCLUSIVELY RESERVED FOR YOUR SUCCESS</div>
    <div id="tv-status-badge">초기화 중...</div>
    <audio id="bgm-player" loop preload="auto"></audio>
  </div>

  <!-- 관리자 화면 -->
  <div id="admin-section">
    <div style="text-align: right; margin-bottom: 15px;">
      <a href="?view=tv" target="_blank" style="color: #c9a96e; font-size: 0.85rem; text-decoration: none;">📺 TV 화면 새 창 열기 ↗</a>
    </div>

    <div class="admin-title">TV 웰컴 보드 설정</div>
    
    <div class="form-group">
      <label>예약자 / 회사명</label>
      <input type="text" id="name-input" placeholder="예: 김대표 님, 삼정회계법인">
    </div>

    <div class="form-group">
      <label>서브 환영 문구</label>
      <textarea id="msg-input" rows="3" placeholder="예: 성공적인 비즈니스 시간 되시기를 바랍니다."></textarea>
    </div>

    <div class="form-group">
      <label>배경 인테리어 테마</label>
      <select id="bg-select">
        <optgroup label="── 하이엔드 마블 & 건축 미학 ──">
          <option value="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2560&q=85">1. 하이엔드 스톤 & 엠비언트 라운지</option>
          <option value="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2560&q=85">2. 미니멀 럭셔리 아키텍처</option>
          <option value="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=2560&q=85">3. 다크 마블 & 쉐도우 인테리어</option>
        </optgroup>
        <optgroup label="── 딥 원목 & 프라이빗 위스키 바 ──">
          <option value="https://images.unsplash.com/photo-1572116469696-31de0f17cc34?auto=format&fit=crop&w=2560&q=85">4. 클래식 딥 월넛 프라이빗 살롱</option>
          <option value="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=2560&q=85">5. 엠버 글로우 & 하이엔드 바</option>
          <option value="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=2560&q=85">6. 5성급 호텔 시그니처 라운지</option>
        </optgroup>
        <optgroup label="── 펜트하우스 나이트 & 프라이빗 이브닝 ──">
          <option value="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=2560&q=85">7. 이그제큐티브 펜트하우스 무드</option>
          <option value="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=2560&q=85">8. 파노라마 하이라이즈 시티뷰</option>
          <option value="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=2560&q=85">9. 미드나잇 스카이라인</option>
          <option value="https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=2560&q=85">10. 샴페인 & 웜 캔들라이트</option>
        </optgroup>
      </select>
    </div>

    <!-- 신뢰성 높은 직접 스트리밍 CDN 음원으로 교체 -->
    <div class="form-group">
      <label>배경음악 (BGM) 선택</label>
      <select id="bgm-select">
        <option value="https://ia801503.us.archive.org/15/items/chill-lounge-bgm-collection/lounge-jazz.mp3">1. 웜 피아노 & 호텔 재즈 라운지</option>
        <option value="https://ia801503.us.archive.org/15/items/chill-lounge-bgm-collection/midnight-lounge.mp3">2. 딥 앰비언트 위스키 바</option>
        <option value="https://ia801503.us.archive.org/15/items/chill-lounge-bgm-collection/bossa-nova.mp3">3. 잔잔한 보사노바 & 칠아웃</option>
        <option value="none">4. 음악 끄기 (BGM Off)</option>
      </select>
    </div>

    <button type="button" id="save-btn">TV 화면에 즉시 반영</button>
    <div id="log-box"></div>
  </div>

  <script>
    // ==============================================================
    // 사장님의 Supabase URL과 Key를 유지해 주세요
    // ==============================================================
    const SUPABASE_URL = 'https://jorxmazliodqnxnwctlc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GAU-azI_hJvms8k3Nzsyiw_PRH0NG69';

    const isTV = window.location.search.indexOf('view=tv') !== -1;

    function log(msg, color) {
      const box = document.getElementById('log-box');
      if (box) {
        box.style.display = 'block';
        box.style.color = color || '#fff';
        box.innerText = msg;
      }
    }

    if (isTV) {
      // 1. TV 디스플레이 모드
      const tvSection = document.getElementById('tv-section');
      const badge = document.getElementById('tv-status-badge');
      const player = document.getElementById('bgm-player');
      player.volume = 0.35; // 35% 볼륨

      tvSection.style.display = 'flex';

      function updateClock() {
        const d = new Date();
        document.getElementById('clock-time').innerText = 
          d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        document.getElementById('clock-date').innerText = 
          d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }
      setInterval(updateClock, 1000);
      updateClock();

      let currentDataKey = '';
      let currentBgmUrl = '';
      let audioNeedClick = false;

      // 브라우저 Autoplay 차단 시: 화면 아무 곳이나 1회 클릭/터치하면 즉시 재생
      function handleUserTouch() {
        if (currentBgmUrl && currentBgmUrl !== 'none') {
          player.play().then(() => {
            badge.innerText = '● BGM 정상 재생 중';
            badge.style.color = '#4ade80';
            audioNeedClick = false;
          }).catch(console.error);
        }
      }
      window.addEventListener('click', handleUserTouch);
      window.addEventListener('touchstart', handleUserTouch);

      function updateBoard(name, msg, bgUrl, bgmUrl) {
        const newKey = name + '|' + msg + '|' + bgUrl + '|' + bgmUrl;
        if (newKey === currentDataKey) return;
        currentDataKey = newKey;

        // 화면 텍스트/배경 전환
        const box = document.getElementById('center-box');
        box.style.opacity = '0';
        setTimeout(function() {
          if (name) document.getElementById('guest-name').innerText = name;
          if (msg) document.getElementById('guest-msg').innerText = msg;
          if (bgUrl) tvSection.style.backgroundImage = "url('" + bgUrl + "')";
          box.style.opacity = '1';
        }, 400);

        // BGM 변경 처리
        if (bgmUrl !== currentBgmUrl) {
          currentBgmUrl = bgmUrl;
          if (!bgmUrl || bgmUrl === 'none') {
            player.pause();
            badge.innerText = '● 정상 연결됨 (음악 OFF)';
            badge.style.color = '#4ade80';
          } else {
            player.src = bgmUrl;
            player.play().then(() => {
              badge.innerText = '● 정상 연결됨 (음악 ON)';
              badge.style.color = '#4ade80';
            }).catch(() => {
              // 브라우저가 자동 소리를 막았을 때 배지에 안내 표시
              badge.innerText = '● 화면을 1회 터치하면 음악이 시작됩니다';
              badge.style.color = '#ffd166';
              audioNeedClick = true;
            });
          }
        }
      }

      async function syncTV() {
        if (!SUPABASE_URL.startsWith('http') || SUPABASE_URL.indexOf('여기에') !== -1) return;
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/welcome_screen?select=*&id=eq.1', {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY
            }
          });
          if (!res.ok) return;

          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];
            let msgText = item.sub_message || '';
            let bg = 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2560&q=85';
            let bgm = 'https://ia801503.us.archive.org/15/items/chill-lounge-bgm-collection/lounge-jazz.mp3';

            if (msgText.indexOf('|||') !== -1) {
              const parts = msgText.split('|||');
              msgText = parts[0];
              bg = parts[1] || bg;
              bgm = parts[2] || bgm;
            }
            updateBoard(item.guest_name, msgText, bg, bgm);
          }
        } catch(e) {}
      }

      syncTV();
      setInterval(syncTV, 1500);

    } else {
      // 2. 모바일 관리자 모드
      document.getElementById('admin-section').style.display = 'block';

      async function loadInitial() {
        if (!SUPABASE_URL.startsWith('http') || SUPABASE_URL.indexOf('여기에') !== -1) return;
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/welcome_screen?select=*&id=eq.1', {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY
            }
          });
          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];
            document.getElementById('name-input').value = item.guest_name || '';
            let msg = item.sub_message || '';
            if (msg.indexOf('|||') !== -1) {
              const parts = msg.split('|||');
              document.getElementById('msg-input').value = parts[0];
              document.getElementById('bg-select').value = parts[1];
              if (parts[2]) document.getElementById('bgm-select').value = parts[2];
            } else {
              document.getElementById('msg-input').value = msg;
            }
          }
        } catch(e) {}
      }
      loadInitial();

      document.getElementById('save-btn').addEventListener('click', async function() {
        const name = document.getElementById('name-input').value.trim();
        const msg = document.getElementById('msg-input').value.trim();
        const bg = document.getElementById('bg-select').value;
        const bgm = document.getElementById('bgm-select').value;

        if (!name) return alert('예약자 이름을 입력해 주세요.');

        log('전송 중...', '#ffd166');
        const combinedMsg = (msg || '편안하고 성공적인 시간 되시기를 바랍니다.') + '|||' + bg + '|||' + bgm;

        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/welcome_screen', {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates,return=representation'
            },
            body: JSON.stringify({
              id: 1,
              guest_name: name,
              sub_message: combinedMsg,
              updated_at: new Date().toISOString()
            })
          });

          if (res.ok) {
            log('✓ TV 반영 성공! (' + new Date().toLocaleTimeString() + ' 전송됨)', '#4ade80');
          } else {
            const errText = await res.text();
            log('✗ 저장 실패: ' + errText, '#ff6b6b');
          }
        } catch(e) {
          log('✗ 오류: ' + e.message, '#ff6b6b');
        }
      });
    }
  </script>
</body>
</html>
