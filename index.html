<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lounge Screen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif; background-color: #121212; color: #fff; }

/* TV 화면 스타일 */
#tv-view { display: none; height: 100vh; flex-direction: column; justify-content: space-between; align-items: center; padding: 60px; text-align: center; }
.clock { font-size: 2rem; color: #888; font-weight: 300; letter-spacing: 2px; }
.main-box { margin: auto 0; transition: opacity 0.6s ease; }
.welcome-title { font-size: 2.2rem; color: #c5a880; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 24px; font-weight: 400; }
.guest-name { font-size: 5rem; font-weight: 600; margin-bottom: 24px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.sub-msg { font-size: 1.8rem; color: #aaa; font-weight: 300; }
.footer { font-size: 1.2rem; color: #555; letter-spacing: 1px; }

/* 모바일 관리자 화면 스타일 */
#admin-view { display: none; padding: 30px 20px; max-width: 480px; margin: 0 auto; }
.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; color: #c5a880; font-size: 0.95rem; }
input, textarea { width: 100%; padding: 14px; background: #222; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 1rem; }
button { width: 100%; padding: 16px; background: #c5a880; border: none; border-radius: 8px; color: #121212; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
button:active { opacity: 0.8; }
</style>
</head>
<body>

<!-- TV 디스플레이 영역 -->
<div id="tv-view">
<div class="clock" id="time-display">00:00</div>
<div class="main-box" id="content-box">
<div class="welcome-title">Private Lounge</div>
<div class="guest-name" id="display-name">Welcome</div>
<div class="sub-msg" id="display-msg">환영합니다.</div>
</div>
<div class="footer">ENJOY YOUR PRIVATE TIME</div>
</div>

<!-- 모바일 관리자 영역 -->
<div id="admin-view">
<h2 style="margin-bottom: 24px; color: #c5a880;">TV 환영 문구 변경</h2>
<div class="form-group">
<label>방문자 / 예약자 이름</label>
<input type="text" id="input-name" placeholder="예: 김대표 님, 에이비씨 컴퍼니">
</div>
<div class="form-group">
<label>안내 문구</label>
<textarea id="input-msg" rows="3" placeholder="예: 프라이빗 라운지에 오신 것을 환영합니다."></textarea>
</div>
<button onclick="updateScreen()">TV 화면에 즉시 반영</button>
</div>

<script>
// 1단계에서 복사한 키 입력
const SUPABASE_URL = 'https://jorxmazliodqnxnwctlc.supabase.co/rest/v1/';
const SUPABASE_KEY = 'sb_publishable_GAU-azI_hJvms8k3Nzsyiw_PRH0NG69';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const isTV = window.location.search.includes('view=tv');

if (isTV) {
document.getElementById('tv-view').style.display = 'flex';
// 시계 동작
setInterval(() => {
const now = new Date();
document.getElementById('time-display').innerText =
now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
}, 1000);

// 데이터 불러오기 및 실시간 반영
async function loadData() {
const { data } = await supabase.from('welcome_screen').select('*').eq('id', 1).single();
if (data) render(data.guest_name, data.sub_message);
}
function render(name, msg) {
const box = document.getElementById('content-box');
box.style.opacity = 0;
setTimeout(() => {
document.getElementById('display-name').innerText = name + ' 님';
document.getElementById('display-msg').innerText = msg;
box.style.opacity = 1;
}, 500);
}
loadData();

// Supabase 실시간 수신 대기
supabase.channel('screen-changes')
.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'welcome_screen' }, payload => {
render(payload.new.guest_name, payload.new.sub_message);
}).subscribe();

} else {
// 관리자 화면
document.getElementById('admin-view').style.display = 'block';
async function updateScreen() {
const name = document.getElementById('input-name').value.trim();
const msg = document.getElementById('input-msg').value.trim();
if (!name) return alert('이름을 입력해주세요.');

await supabase.from('welcome_screen').update({
guest_name: name,
sub_message: msg || '편안하고 생산적인 시간 되시길 바랍니다.',
updated_at: new Date()
}).eq('id', 1);

alert('TV 화면에 반영되었습니다!');
}
}
</script>
</body>
</html>
