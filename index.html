<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Lounge Welcome Screen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c0e;
      color: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 1. TV 디스플레이 화면 */
    #tv-section {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 70px 50px;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1s ease-in-out;
      cursor: pointer;
    }

    /* 배경 비디오 레이어 */
    #bg-video {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    /* 럭셔리 다크 비네팅 오버레이 (글자 가독성 보장) */
    #tv-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(12, 13, 16, 0.55) 0%, rgba(8, 9, 11, 0.92) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .tv-layer { position: relative; z-index: 2; }
    .clock-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .clock-time { font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: #e5e7eb; letter-spacing: 4px; }
    .clock-date { font-size: 0.95rem; color: #8b919d; letter-spacing: 3px; text-transform: uppercase; }

    .center-box { margin: auto 0; transition: opacity 0.5s ease; max-width: 950px; }
    .brand-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: #c9a96e;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: inline-block;
      border-bottom: 1px solid rgba(201, 169, 110, 0.35);
      padding-bottom: 8px;
    }
    .guest-title {
      font-size: 5rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 24px;
      letter-spacing: -1px;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.9);
    }
    .sub-desc { font-size: 1.7rem; color: #b8bdc9; font-weight: 300; line-height: 1.6; }
    .footer-bar { font-size: 0.95rem; color: #555a64; letter-spacing: 4px; text-transform: uppercase; }

    #tv-status-badge {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 9999;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 4px;
      background: rgba(0,0,0,0.7);
      color: #888;
      border: 1px solid #333;
    }

    /* 2. 관리자 화면 */
    #admin-section {
      display: none;
      width: 92%;
      max-width: 480px;
      margin: 30px auto;
      background: #16171b;
      border: 1px solid #282a32;
      border-radius: 18px;
      padding: 28px;
    }
    .admin-title { font-size: 1.3rem; color: #c9a96e; font-weight: 600; margin-bottom: 22px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; color: #9297a3; font-size: 0.9rem; }
    input, textarea, select {
      width: 100%;
      padding: 14px;
      background: #212329;
      border: 1px solid #333640;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #c9a96e; }
    button {
      width: 100%;
      padding: 16px;
      background: #c9a96e;
      border: none;
      border-radius: 10px;
      color: #0d0e11;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    button:active { opacity: 0.8; }
    #log-box {
      margin-top: 15px;
      padding: 12px;
      background: #0f1013;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 0.85rem;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
  </style>
</head>
<body>

  <!-- TV 디스플레이 화면 -->
  <div id="tv-section">
    <!-- 배경 동영상 엘리먼트 (무음/자동재생) -->
    <video id="bg-video" autoplay loop muted playsinline></video>

    <div class="tv-layer clock-box">
      <div class="clock-time" id="clock-time">00:00</div>
      <div class="clock-date" id="clock-date">--</div>
    </div>
    <div class="tv-layer center-box" id="center-box">
      <div class="brand-tag">PRIVATE BUSINESS LOUNGE</div>
      <div class="guest-title" id="guest-name">Welcome</div>
      <div class="sub-desc" id="guest-msg">프라이빗 라운지에 오신 것을 환영합니다.</div>
    </div>
    <div class="tv-layer footer-bar">EXCLUSIVELY RESERVED FOR YOUR SUCCESS</div>
    <div id="tv-status-badge">동기화 대기중...</div>
    <audio id="bgm-player" loop preload="auto"></audio>
  </div>

  <!-- 관리자 화면 -->
  <div id="admin-section">
    <div style="text-align: right; margin-bottom: 15px;">
      <a href="?view=tv" target="_blank" style="color: #c9a96e; font-size: 0.85rem; text-decoration: none;">📺 TV 화면 새 창 열기 ↗</a>
    </div>

    <div class="admin-title">TV 웰컴 보드 설정</div>
    
    <div class="form-group">
      <label>예약자 / 회사명</label>
      <input type="text" id="name-input" placeholder="예: 김대표 님, 삼정회계법인">
    </div>

    <div class="form-group">
      <label>서브 환영 문구</label>
      <textarea id="msg-input" rows="3" placeholder="예: 성공적인 비즈니스 시간 되시기를 바랍니다."></textarea>
    </div>

    <!-- 배경 테마 (시네마틱 모션 비디오 + 정적 하이엔드 이미지) -->
    <div class="form-group">
      <label>배경 인테리어 테마</label>
      <select id="bg-select">
        <optgroup label="── 🎬 시네마틱 모션 비디오 (추천) ──">
          <option value="https://assets.mixkit.co/videos/preview/mixkit-fire-in-a-fireplace-in-close-up-1238-large.mp4">🎬 1. 럭셔리 살롱 엠버 벽난로 (불멍)</option>
          <option value="https://assets.mixkit.co/videos/preview/mixkit-aerial-view-of-city-traffic-at-night-42171-large.mp4">🎬 2. 펜트하우스 나이트 시티뷰</option>
          <option value="https://assets.mixkit.co/videos/preview/mixkit-dark-surfaces-and-soft-ambient-light-40994-large.mp4">🎬 3. 다크 미니멀 앰비언트 섀도우</option>
          <option value="https://assets.mixkit.co/videos/preview/mixkit-pouring-champagne-into-a-glass-at-a-celebration-43306-large.mp4">🎬 4. 골드 샴페인 & VIP 리셉션</option>
        </optgroup>
        <optgroup label="── 🖼 하이엔드 스톤 & 건축 미학 ──">
          <option value="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2560&q=85">5. 하이엔드 스톤 & 엠비언트 라운지</option>
          <option value="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2560&q=85">6. 미니멀 럭셔리 아키텍처</option>
          <option value="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=2560&q=85">7. 다크 마블 & 쉐도우 인테리어</option>
        </optgroup>
        <optgroup label="── 🖼 딥 원목 & 프라이빗 바 ──">
          <option value="https://images.unsplash.com/photo-1572116469696-31de0f17cc34?auto=format&fit=crop&w=2560&q=85">8. 클래식 딥 월넛 프라이빗 살롱</option>
          <option value="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=2560&q=85">9. 엠버 글로우 & 하이엔드 바</option>
          <option value="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=2560&q=85">10. 5성급 호텔 시그니처 라운지</option>
        </optgroup>
      </select>
    </div>

    <!-- 배경음악 (자체 저장소 파일 연결) -->
    <div class="form-group">
      <label>배경음악 (BGM) 선택</label>
      <select id="bgm-select">
        <option value="Respite.mp3">1. Respite - 5 sided cube (자체 음원)</option>
        <option value="jazz2.mp3">2. 라운지 스윙 재즈 트랙 2 (자체 음원)</option>
        <option value="none">3. 음악 끄기 (BGM Off)</option>
      </select>
    </div>

    <button type="button" id="save-btn">TV 화면에 즉시 반영</button>
    <div id="log-box"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jorxmazliodqnxnwctlc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GAU-azI_hJvms8k3Nzsyiw_PRH0NG69';

    const cleanUrl = SUPABASE_URL.trim();
    const cleanKey = SUPABASE_KEY.trim();

    const isTV = window.location.search.indexOf('view=tv') !== -1;

    function log(msg, color) {
      const box = document.getElementById('log-box');
      if (box) {
        box.style.display = 'block';
        box.style.color = color || '#fff';
        box.innerText = msg;
      }
    }

    if (isTV) {
      // 1. TV 디스플레이 모드
      const tvSection = document.getElementById('tv-section');
      const bgVideo = document.getElementById('bg-video');
      const badge = document.getElementById('tv-status-badge');
      const player = document.getElementById('bgm-player');
      player.volume = 0.35;

      tvSection.style.display = 'flex';

      function updateClock() {
        const d = new Date();
        document.getElementById('clock-time').innerText = 
          d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        document.getElementById('clock-date').innerText = 
          d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }
      setInterval(updateClock, 1000);
      updateClock();

      let currentDataKey = '';
      let currentBgmUrl = '';

      function unlockAudio() {
        if (player.src && player.paused && currentBgmUrl !== 'none') {
          player.play().then(() => {
            badge.innerText = '● BGM 정상 재생 중 🎵';
            badge.style.color = '#4ade80';
          }).catch(console.error);
        }
      }
      window.addEventListener('click', unlockAudio);
      window.addEventListener('touchstart', unlockAudio);

      function updateBoard(name, msg, bgUrl, bgmUrl) {
        const newKey = name + '|' + msg + '|' + bgUrl + '|' + bgmUrl;
        if (newKey === currentDataKey) return;
        currentDataKey = newKey;

        // 화면 텍스트 부드럽게 페이드 전환
        const box = document.getElementById('center-box');
        box.style.opacity = '0';
        setTimeout(function() {
          if (name) document.getElementById('guest-name').innerText = name;
          if (msg) document.getElementById('guest-msg').innerText = msg;
          box.style.opacity = '1';
        }, 400);

        // 배경 처리: 동영상(.mp4)인지 일반 이미지인지 판별
        const isVideo = bgUrl.toLowerCase().endsWith('.mp4') || bgUrl.includes('.mp4');
        if (isVideo) {
          tvSection.style.backgroundImage = 'none';
          if (bgVideo.src !== bgUrl) {
            bgVideo.src = bgUrl;
            bgVideo.style.display = 'block';
            bgVideo.load();
            bgVideo.play().catch(console.error);
          }
        } else {
          bgVideo.pause();
          bgVideo.style.display = 'none';
          tvSection.style.backgroundImage = "url('" + bgUrl + "')";
        }

        // BGM 변경 시 처리
        if (bgmUrl !== currentBgmUrl) {
          currentBgmUrl = bgmUrl;
          if (!bgmUrl || bgmUrl === 'none') {
            player.pause();
            badge.innerText = '● 정상 연결됨 (음악 OFF)';
            badge.style.color = '#4ade80';
          } else {
            player.src = bgmUrl;
            player.load();
            player.play().then(() => {
              badge.innerText = '● BGM 정상 재생 중 🎵';
              badge.style.color = '#4ade80';
            }).catch(() => {
              badge.innerText = '⚠️ 화면을 한 번 클릭해 주세요 (음악 켜기)';
              badge.style.color = '#ffd166';
            });
          }
        }
      }

      async function syncTV() {
        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen?select=*&id=eq.1', {
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey
            }
          });
          if (!res.ok) {
            badge.innerText = '읽기 실패 (' + res.status + ')';
            badge.style.color = '#ff6b6b';
            return;
          }

          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];
            let msgText = item.sub_message || '';
            let bg = 'https://assets.mixkit.co/videos/preview/mixkit-fire-in-a-fireplace-in-close-up-1238-large.mp4';
            let bgm = 'jazz1.mp3';

            if (msgText.indexOf('|||') !== -1) {
              const parts = msgText.split('|||');
              msgText = parts[0];
              bg = parts[1] || bg;
              bgm = parts[2] || bgm;
            }
            updateBoard(item.guest_name, msgText, bg, bgm);
          }
        } catch(e) {
          badge.innerText = '통신 에러: ' + e.message;
          badge.style.color = '#ff6b6b';
        }
      }

      syncTV();
      setInterval(syncTV, 1500);

    } else {
      // 2. 관리자 모드
      document.getElementById('admin-section').style.display = 'block';

      async function loadInitial() {
        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen?select=*&id=eq.1', {
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey
            }
          });
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];
            document.getElementById('name-input').value = item.guest_name || '';
            let msg = item.sub_message || '';
            if (msg.indexOf('|||') !== -1) {
              const parts = msg.split('|||');
              document.getElementById('msg-input').value = parts[0];
              document.getElementById('bg-select').value = parts[1];
              if (parts[2]) document.getElementById('bgm-select').value = parts[2];
            } else {
              document.getElementById('msg-input').value = msg;
            }
          }
        } catch(e) {}
      }
      loadInitial();

      document.getElementById('save-btn').addEventListener('click', async function() {
        const name = document.getElementById('name-input').value.trim();
        const msg = document.getElementById('msg-input').value.trim();
        const bg = document.getElementById('bg-select').value;
        const bgm = document.getElementById('bgm-select').value;

        if (!name) return alert('예약자 이름을 입력해 주세요.');

        log('전송 중...', '#ffd166');
        const combinedMsg = (msg || '편안하고 생산적인 비즈니스 시간 되시기를 바랍니다.') + '|||' + bg + '|||' + bgm;

        try {
          const res = await fetch(cleanUrl + '/rest/v1/welcome_screen', {
            method: 'POST',
            headers: {
              'apikey': cleanKey,
              'Authorization': 'Bearer ' + cleanKey,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates,return=representation'
            },
            body: JSON.stringify({
              id: 1,
              guest_name: name,
              sub_message: combinedMsg,
              updated_at: new Date().toISOString()
            })
          });

          if (res.ok) {
            log('✓ TV 반영 성공! (' + new Date().toLocaleTimeString() + ' 전송됨)', '#4ade80');
          } else {
            const errText = await res.text();
            log('✗ 저장 실패: ' + errText, '#ff6b6b');
          }
        } catch(e) {
          log('✗ 오류: ' + e.message, '#ff6b6b');
        }
      });
    }
  </script>
</body>
</html>
